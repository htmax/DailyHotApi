# 与线上实际运行的容器保持一致（原版 compose 会把 6688 暴露到全网，且 user/卷都不对）
services:
  DailyhotApi:
    build:
      context: .
      target: runner
    # 固定 tag，避免被 docker compose 默认命名（dailyhot-api-DailyhotApi）另起一个镜像
    image: dailyhot-api:local
    container_name: dailyhot-api
    # 只监听本机，由 openresty 反代出去
    ports:
      - "127.0.0.1:6688:6688"
    environment:
      - PORT=6688
      - NODE_ENV=docker
      - USE_LOG_FILE=false
      - ALLOWED_HOST=hot.htmax.cn
      - REQUEST_TIMEOUT=15000
    restart: unless-stopped
